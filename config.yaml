scan:
  default_range: "auto"      # "auto" = auto-detect local /24, else e.g. "192.168.1.0/24"
  timeout: 5
  threads: 50
  port_range: "1-1000"
  common_ports: [21, 22, 23, 25, 53, 80, 110, 111, 135, 139, 143, 443, 445, 993, 995, 1723, 3306, 3389, 5900, 8080]
  udp_top_ports: [53, 67, 68, 69, 123, 135, 137, 138, 139, 161, 162, 1900, 4500, 500, 514, 520, 1434, 1900, 5353, 11211]

ai:
  provider: "openrouter"
  model: "openrouter/free"   # auto-router over live free models; or pin one, e.g. "openai/gpt-oss-20b:free"
  api_key: ""                # or set OPENROUTER_API_KEY env var
  max_tokens: 2000
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  timeout: 60

report:
  format: "pdf"
  output_dir: "reports_output"

legal:
  require_authorization: true
  log_scans: true
  log_file: "scan_audit.log"
  db_path: "db/scan_history.db"
